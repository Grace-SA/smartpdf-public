AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Privacy-conscious aggregate product analytics for Smart PDF

Resources:
  AnalyticsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - https://smartpdf.com.au
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Handler: handler.handler
      CodeUri: .
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      ReservedConcurrentExecutions: 10
      Events:
        Event:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyticsApi
            Path: /api/analytics
            Method: POST
  AnalyticsLogRetention:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyticsFunction}
      RetentionInDays: 30

Outputs:
  AnalyticsEndpoint:
    Description: API origin; expose through the site distribution as /api/analytics. Events are retained as structured logs for on-demand analysis.
    Value: !Sub https://${AnalyticsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/api/analytics
