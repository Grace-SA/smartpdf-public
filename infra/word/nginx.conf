# Include in the same HTTPS server block as the static Smart PDF site.
# Set WORD_PUBLIC_ORIGIN to that site's exact HTTPS origin.
location /api/word/ {
    client_max_body_size 30m;
    client_body_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 45s;
    proxy_send_timeout 35s;
    proxy_pass http://127.0.0.1:4268;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
    # No task identifiers, document names, contents or cookies in access logs.
    access_log off;
}
