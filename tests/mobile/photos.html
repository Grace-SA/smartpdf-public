<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>M1 手机验收 · 照片转 PDF</title>
    <style>
      body {
        font: 16px/1.6 system-ui;
        margin: 18px;
        background: #f8f8f3;
        color: #173f32;
      }
      button {
        padding: 14px;
        margin: 8px 0;
        background: #205843;
        color: white;
        border: 0;
        border-radius: 8px;
        width: 100%;
        font-size: 16px;
      }
      button:disabled {
        opacity: 0.45;
      }
      iframe {
        width: 100%;
        height: 800px;
        border: 1px solid #ccd5ce;
        background: white;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      body.running #app {
        position: fixed;
        left: 0;
        top: 120px;
        width: 100vw;
        height: calc(100dvh - 120px);
        z-index: 10;
      }
      body.running #status {
        position: fixed;
        left: 0;
        top: 0;
        box-sizing: border-box;
        padding: 12px;
        background: #f8f8f3;
        width: 100%;
        height: 120px;
        z-index: 11;
        margin: 0;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>手机验收 · M1</h1>
    <p>
      仅使用合成图片测试，不上传你的照片或
      PDF。自动检查结束后，再手动验证选照片和保存。
    </p>
    <p id="status">正在准备图片和应用…</p>
    <label
      ><input id="offline" type="checkbox" />我已关闭 Wi-Fi
      和蜂窝网络，并会保持页面前台、不锁屏</label
    ><button id="run" disabled>开始离线照片测试</button>
    <section id="manual" hidden>
      <h2>自动检查完成后</h2>
      <p>
        在下面的应用内选择自己的 JPEG/PNG 照片，确认缩略图，旋转一次，点击 Apply
        photos。然后点击 Save PDF，并在 iPhone“文件”或下载列表中打开
        PDF，检查方向、页数和内容。请不要只以看到 Download started
        作为保存成功。
      </p>
      <label
        ><input
          id="picked"
          type="checkbox"
        />手动选择照片、旋转并生成成功</label
      ><label
        ><input id="saved" type="checkbox" />已保存并在手机上打开
        PDF，方向、页数和内容正确</label
      ><label
        ><input
          id="orientation"
          type="checkbox"
        />横竖屏下预览与主要按钮可使用</label
      >
      <p>恢复 Wi-Fi 后点击回传。不包含照片、文件名或 PDF 内容。</p>
      <button id="send">将测试结果回传电脑</button>
    </section>
    <details>
      <summary>测试明细</summary>
      <pre id="results"></pre>
    </details>
    <iframe id="app" src="/" title="SmartWorks PDF 测试应用"></iframe>
    <script>
      window.m0Token = "TOKEN_VALUE";
      window.m0Build = BUILD_VALUE;
    </script>
    <script src="/__m1/photos.js"></script>
  </body>
</html>
