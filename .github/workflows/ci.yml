name: Smart PDF checks
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --target .local-python -r scripts/requirements-test.txt
      - name: Repository privacy and asset check
        run: node scripts/check-repository.mjs
      - name: Test repository guard with synthetic index probes
        run: node scripts/test-repository-guard.mjs
      - name: Generate synthetic boundary fixtures
        run: python -B scripts/m5-fixtures.py
      - name: Generate synthetic unlock fixtures
        # Unlock variants are reproducible synthetic data, never private files.
        run: node scripts/m12-fixtures.mjs
      - name: Type check
        run: pnpm typecheck
      - name: Application lint
        run: pnpm exec eslint src scripts/check-repository.mjs scripts/prepare-release.mjs
      - name: Unit and integration regression
        run: pnpm test
      - name: Independent page-number output verification
        run: python -B scripts/verify-number-output.py
        env:
          PYTHONPATH: .local-python
      - name: Independent unlock output verification
        # Verify decrypted contents independently of the qpdf engine.
        run: python -B scripts/verify-unlock-output.py
        env:
          PYTHONPATH: .local-python
      - name: Independent protect output verification
        run: python -B scripts/verify-protect-output.py
        env:
          PYTHONPATH: .local-python
      - name: PDF to Excel real conversion tests
        run: |
          python -m venv .pdf-excel-env
          .pdf-excel-env/bin/pip install torch==2.15.0 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          .pdf-excel-env/bin/pip install -r server/pdf-to-excel/requirements-lock.txt reportlab==4.4.9
          .pdf-excel-env/bin/pip check
          .pdf-excel-env/bin/python scripts/pdf-to-excel/prepare-models.py .pdf-excel-models
          .pdf-excel-env/bin/python -m unittest discover -s scripts/pdf-to-excel -p 'test_*.py'
          .pdf-excel-env/bin/python scripts/pdf-to-excel/fixtures.py .pdf-excel-fixtures
        env:
          PDF_EXCEL_MODELS: .pdf-excel-models
          HF_HUB_DISABLE_TELEMETRY: "1"
      - name: Build all public pages
        run: pnpm build
        env:
          VITE_ENABLE_PROTECT: "true"
          VITE_ENABLE_EXCEL: "true"
          VITE_ENABLE_PDF_EXCEL: "true"
      - name: Select Ubuntu primary mirror for browser dependencies
        run: |
          # The runner's Azure mirror can stall while downloading browsers'
          # system packages. Keep Ubuntu's signed packages and all checks.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: node node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.browser }}
      - name: WebKit environment preflight
        if: matrix.browser == 'webkit'
        run: >-
          pnpm exec playwright test --config playwright.github.config.ts --project webkit
          --grep 'cloud navigation stops|390: every local tool exchanges|1280: every tool-to-tool|back from a completed task|browser back and forward restore clean tool pickers|Type: offline multilingual signing|200 pages and unusual sizes retain|PERF-SIGN|images 390: completion|completed images → Split|image and generated PDF previews|probe waits for worker readiness|repeated image generation|leave confirmation restores focus before removal|photos leave confirmation|renderer waits for PDF.js readiness|credentials consent prepares|dialog closes before removal'
        env:
          DEBUG: pw:browser
      - name: M9 WebKit navigation stability
        if: matrix.browser == 'webkit'
        run: pnpm exec playwright test --config playwright.github.config.ts --project webkit --grep 'continuous preview navigation|being typed survives' --repeat-each 3
        env:
          DEBUG: pw:browser
      - name: Browser regression across all tools
        run: pnpm exec playwright test --config playwright.github.config.ts --project ${{ matrix.browser }}
      - name: PDF to Excel browser smoke
        run: pnpm exec playwright test --config playwright.pdf-excel.config.ts
        env:
          PDF_EXCEL_PYTHON: .pdf-excel-env/bin/python
          PDF_EXCEL_MODELS: .pdf-excel-models
          PDF_EXCEL_OCR: "true"
          PDF_EXCEL_BROWSER: ${{ matrix.browser }}
      - name: Build and smoke-test isolated PDF to Excel container
        if: matrix.browser == 'chromium'
        run: |
          docker build -f server/pdf-to-excel/Dockerfile -t smartpdf-excel:test .
          docker run -d --name pdf-excel-smoke --network none --read-only --memory 4g --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=768m,mode=1777 -v "$PWD/.pdf-excel-fixtures:/fixtures:ro" smartpdf-excel:test
          trap 'docker rm -f pdf-excel-smoke' EXIT
          docker exec -i pdf-excel-smoke node --input-type=module < scripts/pdf-to-excel/container-smoke.mjs
          docker cp pdf-excel-smoke:/tmp/smoke-workbooks .pdf-excel-container-output
          .pdf-excel-env/bin/python scripts/pdf-to-excel/verify-container.py .pdf-excel-fixtures .pdf-excel-container-output
      - name: Build publication scope
        run: pnpm build
        env:
          VITE_ENABLE_PROTECT: "false"
          VITE_ENABLE_EXCEL: "true"
      - name: Verify published tool boundaries
        run: pnpm exec playwright test --config playwright.published.config.ts --project ${{ matrix.browser }}
      - name: Retain synthetic diagnostic text on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-diagnostics-${{ matrix.browser }}
          path: |
            docs/evidence/github-browser.json
            docs/evidence/github-published-browser.json
            test-results-published/**/error-context.md
            test-results-github/**/error-context.md
            test-results/**/error-context.md
            test-results-pdf-excel/report.json
          retention-days: 3
          if-no-files-found: ignore
