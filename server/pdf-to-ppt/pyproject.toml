[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "smartpdf-ppt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "python-multipart", "pypdfium2", "pypdf", "python-pptx", "pillow", "numpy", "fonttools==4.68.0"]
[project.optional-dependencies]
test = ["pytest", "pytest-cov", "reportlab"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
smartppt = ["OFL-NotoSansSC.txt", "OFL-NotoSerifSC.txt"]
